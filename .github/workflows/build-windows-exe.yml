name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.7'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install ffmpeg/ffprobe
        run: |
          choco install ffmpeg --no-progress -y

      - name: Prepare ffprobe binary
        shell: pwsh
        run: |
          $ffprobe = Get-Command ffprobe -ErrorAction SilentlyContinue
          if ($ffprobe) {
            Copy-Item $ffprobe.Source -Destination ffprobe.exe -Force
          }

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.in-project true
          poetry env use python

      - name: Install dependencies
        run: |
          poetry install --no-interaction --with dev --no-root

      - name: Run Python tests
        run: |
          poetry run python -m unittest discover -s tests -v

      - name: Build Windows executable with Flet
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          $env:TERM = "dumb"
          $env:FORCE_COLOR = "0"
          poetry run flet build windows -vv -o dist/flet-windows --skip-flutter-doctor --yes --no-rich-output

      - name: Verify Windows drag-and-drop plugin
        shell: pwsh
        run: |
          $registrant = "build/flutter/windows/flutter/generated_plugin_registrant.cc"
          $plugins = "build/flutter/windows/flutter/generated_plugins.cmake"
          $dropzone = "build/flutter-packages/flet_dropzone/lib/src/flet_dropzone.dart"

          foreach ($path in @($registrant, $plugins, $dropzone)) {
            if (-not (Test-Path $path)) {
              throw "Expected generated drag-and-drop build file not found: $path"
            }
          }

          $registrantText = Get-Content $registrant -Raw
          if ($registrantText -notmatch "DesktopDropPluginRegisterWithRegistrar") {
            throw "desktop_drop is missing from the Windows plugin registrant"
          }

          $pluginsText = Get-Content $plugins -Raw
          if ($pluginsText -notmatch "(?m)^\s+desktop_drop\s*$") {
            throw "desktop_drop is missing from the Windows CMake plugin list"
          }

          $dropzoneText = Get-Content $dropzone -Raw
          if ($dropzoneText -notmatch "DropTarget" -or $dropzoneText -notmatch "onDragDone") {
            throw "The generated flet_dropzone control does not handle dropped files"
          }

      - name: Stage complete Windows application
        shell: pwsh
        run: |
          $searchRoots = @("dist/flet-windows", "build/windows") |
            Where-Object { Test-Path $_ }
          $exe = Get-ChildItem -Path $searchRoots -Recurse -File -Filter "*.exe" |
            Where-Object { $_.BaseName -ieq "photosorter" } |
            Select-Object -First 1
          if (-not $exe) { throw "PhotoSorter Windows executable not found" }

          $bundle = $exe.Directory.FullName
          if (-not (Test-Path (Join-Path $bundle "flutter_windows.dll"))) {
            throw "The Windows Flutter runtime is missing next to $($exe.Name)"
          }
          if (-not (Test-Path (Join-Path $bundle "data"))) {
            throw "The Windows application data directory is missing next to $($exe.Name)"
          }

          $stage = "dist/PhotoSorter-Windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path (Join-Path $bundle "*") -Destination $stage -Recurse -Force

          if (-not (Test-Path (Join-Path $stage $exe.Name))) {
            throw "Failed to stage the executable and its runtime files"
          }

      - name: Upload Windows application bundle
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSorter-Windows-x64
          path: dist/PhotoSorter-Windows/
          if-no-files-found: error
