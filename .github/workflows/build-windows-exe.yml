name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.7'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install ffmpeg/ffprobe
        run: |
          choco install ffmpeg --no-progress -y

      - name: Prepare ffprobe binary
        shell: pwsh
        run: |
          $ffprobe = Get-Command ffprobe -ErrorAction SilentlyContinue
          if ($ffprobe) {
            Copy-Item $ffprobe.Source -Destination ffprobe.exe -Force
          }

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.in-project true
          poetry env use python

      - name: Install dependencies
        run: |
          poetry install --no-interaction --with dev

      - name: Build Windows executable with Flet
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          $env:TERM = "dumb"
          $env:FORCE_COLOR = "0"
          poetry run flet build windows -o dist/flet-windows --skip-flutter-doctor --yes --no-rich-output

      - name: Locate Windows EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/flet-windows-output | Out-Null
          $exe = Get-ChildItem -Path . -Recurse -Filter "PhotoSorter.exe" | Select-Object -First 1 -Expand FullName
          if (-not $exe) { throw "PhotoSorter.exe not found" }
          Copy-Item $exe -Destination dist/flet-windows-output/PhotoSorter.exe

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSorter-Windows-EXE
          path: dist/flet-windows-output/PhotoSorter.exe
          if-no-files-found: error
