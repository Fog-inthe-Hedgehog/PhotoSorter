name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Configure Poetry virtualenv
        run: |
          poetry config virtualenvs.in-project true
          poetry env use python

      - name: Install dependencies
        run: |
          poetry install --no-interaction --with dev --no-root

      - name: Build Windows executable
        run: |
          poetry run pyinstaller --noconfirm --clean --distpath dist/exe --workpath build/pyinstaller photosorter.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSorter-Windows-EXE
          path: dist/exe/PhotoSorter.exe
          if-no-files-found: error
